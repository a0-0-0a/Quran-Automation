[package]
name = "lumen3d"
version = "0.1.0"
edition = "2021"

[dependencies]
rustybuzz = "=0.12.1"
rayon = "=1.8.1"
png = "=0.17.10"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
serde_json = "=1.0.145"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
